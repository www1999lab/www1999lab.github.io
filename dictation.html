<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Dictation</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --ok: #047857;
      --danger: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.04);
    }
    h1 { margin-top: 0; }
    .muted { color: var(--muted); }
    input, textarea, button {
      width: 100%;
      font: inherit;
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 12px;
      margin-top: 10px;
    }
    button {
      cursor: pointer;
      background: var(--primary);
      color: #fff;
      border: none;
    }
    button.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
    }
    button.ok { background: var(--ok); }
    .hidden { display: none; }
    audio { width: 100%; margin-top: 10px; }
    textarea { min-height: 130px; resize: vertical; }
    .result {
      font-weight: 700;
      margin-top: 14px;
    }
    .answer {
      background: #f9fafb;
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .progress {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0;
    }
    .bar {
      height: 100%;
      width: 0;
      background: var(--primary);
    }
    @media (max-width: 640px) {
      .wrap { padding: 14px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loginBox" class="card">
      <h1>Private English Room</h1>
      <p class="muted">输入密码后进入你的私人听写练习页面。</p>
      <input type="password" id="passwordInput" placeholder="Enter password" />
      <button onclick="checkPassword()">Enter</button>
      <p class="muted">提示：这个密码适合防普通人，不是真正服务器级加密。</p>
    </div>

    <div id="app" class="hidden">
      <div class="card">
        <h1>English Dictation Practice</h1>
        <p id="progressText" class="muted"></p>
        <div class="progress"><div id="bar" class="bar"></div></div>

        <audio id="audio" preload="metadata"></audio>

        <button onclick="playCurrent()">Play Current Sentence</button>

        <textarea id="userInput" placeholder="Type what you hear..."></textarea>

        <div class="row">
          <button class="ok" onclick="checkAnswer()">Check</button>
          <button class="secondary" onclick="showAnswer()">Show Answer</button>
          <button onclick="nextSentence()">Next</button>
        </div>

        <div id="result" class="result"></div>
        <div id="answer" class="answer hidden"></div>
      </div>
    </div>
  </div>

<script src="dictation-data.js"></script>
<script>
  const PASSWORD = "123456"; // 改成你自己的密码
  let current = 0;
  let stopHandler = null;

  const loginBox = document.getElementById("loginBox");
  const app = document.getElementById("app");
  const audio = document.getElementById("audio");

  function checkPassword() {
    const password = document.getElementById("passwordInput").value;
    if (password === PASSWORD) {
      loginBox.classList.add("hidden");
      app.classList.remove("hidden");
      loadSentence();
    } else {
      alert("Wrong password");
    }
  }

  document.getElementById("passwordInput").addEventListener("keydown", (event) => {
    if (event.key === "Enter") checkPassword();
  });

  function loadSentence() {
    if (!Array.isArray(dictationData) || dictationData.length === 0) {
      alert("dictation-data.js 里没有数据。");
      return;
    }

    const item = dictationData[current];
    audio.src = item.audio;
    document.getElementById("userInput").value = "";
    document.getElementById("result").innerText = "";
    document.getElementById("answer").innerText = "";
    document.getElementById("answer").classList.add("hidden");

    document.getElementById("progressText").innerText =
      `Sentence ${current + 1} / ${dictationData.length}`;

    document.getElementById("bar").style.width =
      `${((current + 1) / dictationData.length) * 100}%`;
  }

  function playCurrent() {
    const item = dictationData[current];

    if (stopHandler) {
      audio.removeEventListener("timeupdate", stopHandler);
      stopHandler = null;
    }

    audio.currentTime = Number(item.start || 0);
    audio.play();

    stopHandler = () => {
      if (audio.currentTime >= Number(item.end || 0)) {
        audio.pause();
        audio.removeEventListener("timeupdate", stopHandler);
        stopHandler = null;
      }
    };

    audio.addEventListener("timeupdate", stopHandler);
  }

  function normalize(text) {
    return text
      .toLowerCase()
      .replace(/[.,!?;:"'’‘“”()\-]/g, "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function checkAnswer() {
    const user = normalize(document.getElementById("userInput").value);
    const correct = normalize(dictationData[current].text);

    if (!user) {
      document.getElementById("result").innerText = "请先输入你听到的英文。";
      return;
    }

    if (user === correct) {
      document.getElementById("result").innerText = "✅ Correct!";
    } else {
      document.getElementById("result").innerText = "❌ Not exactly. You can try again or show the answer.";
    }
  }

  function showAnswer() {
    const answer = document.getElementById("answer");
    answer.innerText = dictationData[current].text;
    answer.classList.remove("hidden");
  }

  function nextSentence() {
    if (current < dictationData.length - 1) {
      current++;
      loadSentence();
    } else {
      alert("Finished!");
    }
  }
</script>
</body>
</html>
